name = "tweede-brein-push"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Elke dag om 08:00 Nederlandse winter-/zomertijd (UTC+1/+2) -> 07:00 UTC
# is een redelijk gemiddelde; cron draait altijd in UTC.
[triggers]
crons = ["0 7 * * *"]

# Wordt aangemaakt met: wrangler kv namespace create SUBSCRIPTIONS
# Vul hierna het "id" hieronder in met wat dat commando teruggeeft.
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "9567ad3613874148b596adb84901fbef"

[vars]
VAPID_PUBLIC_KEY = "BNOpO7EPE3WHFC5G0kaoSzbKeXpsjorXCLHa_dWei8tCerkgJRIuzxJ73YOaUzKXLCUD1ph8EBUYvXGwyaaL3V4"

[ai]
binding = "AI"
