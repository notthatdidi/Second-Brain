<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tweede brein</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#c9778f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tweede brein" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Serif:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Tweede brein</h1>
      <div class="app__header-right">
        <button type="button" id="notifyToggle" class="notify-toggle" aria-label="Herinneringen uitgeschakeld">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 14 6 10Z" />
            <path d="M10 19a2 2 0 0 0 4 0" />
          </svg>
        </button>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </header>

    <section class="dump">
      <textarea
        id="dumpInput"
        class="dump__input"
        placeholder="Wat zit er in je hoofd?"
        rows="3"
        autocomplete="off"
      ></textarea>

      <div class="dump__date">
        <svg class="dump__date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="5.5" width="16" height="14.5" rx="2.5" />
          <path d="M4 10h16M8 3.5v3M16 3.5v3" />
        </svg>
        <label for="dateInput" class="dump__date-label">Voor wanneer?</label>
        <input type="date" id="dateInput" class="dump__date-input" />
        <button type="button" id="dateClear" class="dump__date-clear" hidden aria-label="Datum wissen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <div class="dump__buttons">
        <button class="btn btn--taak" data-type="taak">
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h11M8 12h11M8 18h8" />
            <path d="M4 6h.01M4 12h.01M4 18h.01" />
          </svg>
          <span>Taak</span>
        </button>
        <button class="btn btn--afspraak" data-type="afspraak">
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5.5" width="16" height="14.5" rx="2.5" />
            <path d="M4 10h16M8 3.5v3M16 3.5v3" />
          </svg>
          <span>Afspraak</span>
        </button>
        <button class="btn btn--later" data-type="later">
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12.5" r="8" />
            <path d="M12 8.5v4l2.6 2" />
          </svg>
          <span>Later</span>
        </button>
        <button class="btn btn--auto" id="autoBtn">
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M17.7 6.3l-2.1 2.1M8.4 15.6l-2.1 2.1" />
          </svg>
          <span>Automatisch</span>
        </button>
      </div>
    </section>

    <section class="today">
      <h2>Vandaag</h2>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>Niks op je lijst. Rustig aan.</p>
    </section>

    <section class="progress-card">
      <span class="label-caps">Deze week</span>
      <div class="progress-card__chart" id="progressChart"></div>
      <div class="progress-card__streak">
        <span class="progress-card__streak-num" id="streakNum">0</span>
        <span class="progress-card__streak-text">dagen op rij</span>
      </div>
    </section>
  </main>

  <div id="overdueOverlay" class="overdue-overlay" hidden>
    <div class="overdue-overlay__card">
      <h2 class="overdue-overlay__title">Dit is blijven liggen</h2>
      <p class="overdue-overlay__sub">Even een keuze maken voor je verder kan.</p>
      <ul id="overdueList" class="overdue-list"></ul>
    </div>
  </div>

  <div id="toast" class="toast" hidden>
    <svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 13l4 4L19 7" />
    </svg>
    <span class="toast__text" id="toastText">Mooi gedaan</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
